// DO NOT EDIT THIS FILE! IT IS GENERATED EACH TIME "capacitor update" IS RUN

android {
  compileOptions {
      sourceCompatibility JavaVersion.VERSION_21
      targetCompatibility JavaVersion.VERSION_21
  }
}

// capacitor-cordova-android-plugins is generated only when Cordova plugins
// are present. A clean Git checkout may not contain this directory.
def cordovaVariables = file("../capacitor-cordova-android-plugins/cordova.variables.gradle")
if (cordovaVariables.exists()) {
    apply from: cordovaVariables
}

dependencies {
    implementation project(':capacitor-filesystem')
    implementation project(':capacitor-share')
}

if (hasProperty('postBuildExtras')) {
  postBuildExtras()
}
